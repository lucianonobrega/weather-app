<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="css/config.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="h-screen bg-[url('/assets/imagens/Background-Image-Light.png')] bg-cover bg-no-repeat bg-center flex flex-col items-center justify-center">
    <div class="w-[100%] overflow-hidden text-[var(--preto)] flex flex-col items-center gap-[3rem] p-[3rem] sm:w-[60rem] sm:border-[0.2rem] sm:border-[var(--branco)] sm:bg-[var(--brancoTransparente)] sm:backdrop-blur-sm sm:rounded-[5rem]">
        <div class="w-[100%] relative flex flex-col justify-center">
            <input class="w-[100%] py-[1.5rem] pl-[3rem] rounded-[5rem] border-[0.2rem] border-transparent outline-none focus:border-[var(--preto)] bg-[var(--brancoTransparente2)] text-[1.5rem]" type="text" placeholder="Buscar cidade..." id="input">
            <img class="w-[1.6rem] absolute right-[3rem] cursor-pointer" src="assets/imagens/search.png" alt="lupaPesquisa">
        </div>
        <div class="flex flex-col items-center justify-center text-[2rem] gap-[1rem]">
            <h1 class="text-[3.2rem] font-bold" id="cidade">Local</h1>
            <div>
                <p class="text-[1.8rem]" id="ceu">Sem info</p>
            </div>
            <p class="text-[6rem] sm:text-[9rem]" id="temp">Sem info</p>
            <p id="sensacaoTermica">Sensação Térmica: Sem info</p>
        </div>
        <div class="w-[90%] py-[1rem] flex flex-col items-center justify-center gap-[5rem] text-[2rem] sm:flex-row">
            <div class="h-full py-[1rem] px-[2rem] rounded-[0.7rem] border-[0.2rem] border-[var(--branco)] bg-[var(--brancoTransparente)] backdrop-blur-[0.2rem] flex flex-col items-center justify-center gap-[0.5rem]">
                <p id="tempMax">Máxima: Sem info</p>
                <p id="tempMin">Mínima: Sem info</p>
            </div>
            <div class="h-full py-[1rem] px-[2rem] rounded-[0.7rem] border-[0.2rem] border-[var(--branco)] bg-[var(--brancoTransparente)] backdrop-blur-[0.2rem] flex flex-col items-center justify-center gap-[0.5rem]">
                <p id="umidade">Umidade: Sem info</p>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
